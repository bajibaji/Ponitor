name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ -n "$v" ] || v="dev"
          echo "value=$v" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build icon
        run: windres -i icon.rc -O coff -o icon_windows_amd64.syso

      - name: Build
        run: |
          CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-H=windowsgui -s -w" \
            -o "Ponitor_${{ steps.version.outputs.value }}_windows_${{ matrix.goarch }}.exe" .
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ponitor-${{ steps.version.outputs.value }}-windows-${{ matrix.goarch }}
          path: Ponitor_*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Ponitor_*.exe
          generate_release_notes: true
